<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

  <title>Triple T งานช่าง</title>

  <meta name="theme-color" content="#0f4f82">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Triple T งานช่าง">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f6f9;
    }

    body {
      position: fixed;
      inset: 0;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      box-sizing: border-box;
    }

    #app {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #f3f6f9;
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f6f9;
      color: #174f7d;
      font-family: Arial, sans-serif;
      font-weight: 700;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="boot">กำลังเปิด Triple T งานช่าง...</div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbxzxMpRPzCP8cEp4uXRQnczy9dWnN8D7UQ3aqrj40SET1xC-5isI5vwmLV15usBWuCP/exec"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <script>
    const frame = document.getElementById('app');
    const boot = document.getElementById('boot');

    frame.addEventListener('load', () => {
      boot.style.display = 'none';
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
